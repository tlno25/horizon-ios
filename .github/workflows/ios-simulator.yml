name: Horizon iOS Manual Build

permissions:
  contents: read

# macOS builders are expensive in runner minutes. Never build for every push.
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Which artifact to build?'
        type: choice
        options:
          - device
          - simulator
          - both
          - game
          - game-launcher
          - game-simulator
          - game-smoke
        required: true
        default: device
      source_game_simulator_run:
        description: 'For game-smoke only: successful game-simulator workflow run ID to reuse'
        type: string
        required: false
      simulator_smoke:
        description: 'Launch Simulator and test Metal (slower; skip for compile-only checks)'
        type: boolean
        required: false
        default: false
      renderer_probe:
        description: 'Run the experimental real Horizon GPU preview (Simulator only)'
        type: boolean
        required: false
        default: false

# Allow only one costly manual build per branch at once; no implicit cancellation
# of a build that has already consumed macOS minutes.
concurrency:
  group: horizon-ios-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Short macOS feedback cycle: check native SwiftUI independently of the
  # 20+ minute Rust game build. This catches XcodeGen and Swift compiler errors
  # before requesting a full native game IPA.
  launcher-only-build:
    if: ${{ inputs.build_target == 'game-launcher' }}
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile native SwiftUI game launcher (iOS Simulator)
        run: |
          bash packaging/ios/build_game_launcher.sh iphonesimulator x86_64 "$RUNNER_TEMP/HorizonGameLauncherOnly"
      - name: Verify SwiftUI launcher C ABI symbol and architecture
        run: |
          set -euo pipefail
          framework="$RUNNER_TEMP/HorizonGameLauncherOnly/Build/Products/Release-iphonesimulator/HorizonLauncherKit.framework"
          test -f "$framework/Info.plist"
          xcrun lipo -archs "$framework/HorizonLauncherKit" | grep -qw x86_64
          xcrun nm -g "$framework/HorizonLauncherKit" | grep -Fq _horizon_launcher_present
          echo 'iOS SwiftUI launcher framework and Rust bridge entrypoint validated.'

  simulator-build:
    if: ${{ inputs.build_target == 'simulator' || inputs.build_target == 'both' }}
    # Intel macOS runners are usually available even when macOS arm64 workers
    # are capacity-constrained. Test the actual x86_64 Simulator runtime here;
    # the independent device job still cross-compiles real iPhoneOS arm64.
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: x86_64-apple-ios
      - name: Cache Rust dependencies and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: horizon-ios-macos
          cache-on-failure: true
      - name: Build and link the iOS Simulator app (x86_64)
        run: |
          xcodebuild \
            -project packaging/ios/HorizonIOS.xcodeproj \
            -derivedDataPath "$RUNNER_TEMP/HorizonDerivedData" \
            -scheme HorizonIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=x86_64 \
            build
      - name: Package the Simulator app
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/package_app.sh simulator
      - name: Upload Simulator app (unsigned .app.zip)
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-simulator-app
          path: ${{ runner.temp }}/horizon-ios-artifacts/HorizonIOS-simulator-unsigned.zip
          if-no-files-found: error
          retention-days: 7
      - name: Launch in iPhone Simulator and capture preview
        if: ${{ inputs.simulator_smoke || inputs.renderer_probe }}
        timeout-minutes: 6
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
          # Keep the same booted simulator only when a second probe is requested.
          HORIZON_IOS_SIMULATOR_KEEP_BOOTED: ${{ inputs.renderer_probe && '1' || '0' }}
        run: packaging/ios/tests/simulator_smoke.sh
      - name: Upload iOS native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-simulator-logs
          path: ${{ runner.temp }}/horizon-ios-simulator-native.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-simulator-preview
          path: ${{ runner.temp }}/horizon-ios-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Probe real Horizon boot renderer in iOS Simulator (experimental)
        if: ${{ inputs.renderer_probe }}
        # If simctl bootstatus or GPU startup stalls, fail only this probe
        # after five minutes rather than consuming the rest of a macOS job.
        timeout-minutes: 5
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
          HORIZON_IOS_SIMULATOR_REUSE_BOOT: "1"
        run: packaging/ios/tests/simulator_renderer_smoke.sh
      - name: Upload Horizon boot-renderer diagnostic status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-boot-renderer-status
          path: |
            ${{ runner.temp }}/horizon-ios-boot-renderer-*.json
            ${{ runner.temp }}/horizon-ios-boot-renderer-*.log
            ${{ runner.temp }}/horizon-ios-boot-renderer-*.png
          if-no-files-found: ignore
          retention-days: 7

  device-build:
    if: ${{ inputs.build_target == 'device' || inputs.build_target == 'both' }}
    # Cross-compile ARM64 iPhoneOS on an Intel Mac when Apple Silicon runners
    # are capacity constrained. The app binary is still arm64 for real iPhones.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target for real iOS hardware
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-ios
      - name: Cache Rust dependencies and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: horizon-ios-macos
          cache-on-failure: true
      - name: Build unsigned iPhone/iPad app
        run: |
          xcodebuild \
            -project packaging/ios/HorizonIOS.xcodeproj \
            -derivedDataPath "$RUNNER_TEMP/HorizonDerivedData" \
            -scheme HorizonIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build
      - name: Package unsigned device IPA and verify its ZIP payload
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/package_unsigned_ipa.sh
      - name: Upload horizon-ios-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-unsigned-ipa
          path: ${{ runner.temp }}/horizon-ios-artifacts/horizon-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  # Experimental playable-game executable built separately from the SwiftUI
  # diagnostic shell. Unlike the shell IPA, this is the actual horizon-client
  # binary and still needs the player's prepared assets and mobile inputs.
  game-build:
    if: ${{ inputs.build_target == 'game' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      HORIZON_TELEMETRY_URL: "off"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target for the native game
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-ios
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: horizon-ios-native-game
          cache-on-failure: true
      - name: Compile the real Horizon client executable for iPhoneOS
        run: |
          cargo build --release --locked --target aarch64-apple-ios -p horizon-client --no-default-features --features audio --bin horizon-client
      - name: Build SwiftUI launcher in the native game bundle
        run: bash packaging/ios/build_game_launcher.sh iphoneos arm64 "$RUNNER_TEMP/HorizonGameLauncherDerived"
      - name: Prepare native game resource manifest config
        env:
          HORIZON_IOS_RESOURCES_MANIFEST_URL: ${{ vars.HORIZON_IOS_RESOURCES_MANIFEST_URL }}
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        run: |
          python3 packaging/ios/configure_game_plist.py \
            --source packaging/ios/GameInfo.plist \
            --output "$RUNNER_TEMP/HorizonGameInfo.plist" \
            --manifest-url "$HORIZON_IOS_RESOURCES_MANIFEST_URL" \
            --microsoft-client-id "$HORIZON_MSA_CLIENT_ID"
      - name: Verify arm64 executable and package native game IPA
        run: |
          set -euo pipefail
          binary="target/aarch64-apple-ios/release/horizon-client"
          test -f "$binary"
          xcrun lipo -archs "$binary" | grep -qw arm64
          python3 packaging/ios/package_native_game_ipa.py \
            --binary "$binary" \
            --plist "$RUNNER_TEMP/HorizonGameInfo.plist" \
            --launcher-framework "$RUNNER_TEMP/HorizonGameLauncherDerived/Build/Products/Release-iphoneos/HorizonLauncherKit.framework" \
            --output "$RUNNER_TEMP/horizon-ios-artifacts/Horizon-game-unsigned.ipa"
      - name: Verify the unsigned native IPA and its app metadata
        run: |
          python3 -m unittest discover -s packaging/ios/tests -p 'test_native_game_ipa.py'
          python3 - <<'PYVALID'
          import plistlib
          import zipfile
          from pathlib import Path
          ipa = Path(__import__('os').environ['RUNNER_TEMP']) / 'horizon-ios-artifacts/Horizon-game-unsigned.ipa'
          with zipfile.ZipFile(ipa) as archive:
              entries = archive.namelist()
              prefix = 'Payload/HorizonGame.app/'
              assert prefix + 'HorizonGame' in entries
              assert prefix + 'Frameworks/HorizonLauncherKit.framework/HorizonLauncherKit' in entries
              info = plistlib.loads(archive.read(prefix + 'Info.plist'))
              assert info['CFBundleExecutable'] == 'HorizonGame'
              assert info['UIFileSharingEnabled']
              assert not any('horizon-resources.json' in entry for entry in entries)
          print('Native game IPA archive verified (assets excluded).')
          PYVALID
      - name: Upload experimental native Horizon game IPA
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-native-game-ipa
          path: ${{ runner.temp }}/horizon-ios-artifacts/Horizon-game-unsigned.ipa
          if-no-files-found: error
          retention-days: 7


  # Distinct arm64 Simulator app for runtime inspection of the actual Rust
  # gameplay executable. Does not imply a working game without player assets.
  game-simulator-build:
    if: ${{ inputs.build_target == 'game-simulator' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      HORIZON_TELEMETRY_URL: "off"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target for Apple Silicon iOS Simulator
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-ios-sim
      - name: Cache native game Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: horizon-ios-game-simulator
          cache-on-failure: true
      - name: Build real Horizon game for iPhone Simulator (arm64)
        run: |
          cargo build --release --locked --target aarch64-apple-ios-sim -p horizon-client --no-default-features --features audio --bin horizon-client
      - name: Build SwiftUI launcher for the game Simulator
        run: bash packaging/ios/build_game_launcher.sh iphonesimulator arm64 "$RUNNER_TEMP/HorizonGameLauncherDerived"
      - name: Prepare native Simulator game resource manifest config
        env:
          HORIZON_IOS_RESOURCES_MANIFEST_URL: ${{ vars.HORIZON_IOS_RESOURCES_MANIFEST_URL }}
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        run: |
          python3 packaging/ios/configure_game_plist.py \
            --source packaging/ios/GameInfo.plist \
            --output "$RUNNER_TEMP/HorizonGameInfo.plist" \
            --manifest-url "$HORIZON_IOS_RESOURCES_MANIFEST_URL" \
            --microsoft-client-id "$HORIZON_MSA_CLIENT_ID"
      - name: Package native game Simulator .app without Minecraft resources
        run: |
          set -euo pipefail
          target="target/aarch64-apple-ios-sim/release/horizon-client"
          xcrun lipo -archs "$target" | grep -qw arm64
          python3 packaging/ios/package_native_game_simulator.py \
            --binary "$target" \
            --architecture arm64 \
            --plist "$RUNNER_TEMP/HorizonGameInfo.plist" \
            --launcher-framework "$RUNNER_TEMP/HorizonGameLauncherDerived/Build/Products/Release-iphonesimulator/HorizonLauncherKit.framework" \
            --output-app "$RUNNER_TEMP/horizon-ios-game-artifacts/HorizonGame.app"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/horizon-ios-game-artifacts/HorizonGame.app" \
            "$RUNNER_TEMP/horizon-ios-game-artifacts/HorizonGame-simulator-unsigned.zip"
      - name: Upload the real game Simulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-game-simulator-app
          path: ${{ runner.temp }}/horizon-ios-game-artifacts/HorizonGame-simulator-unsigned.zip
          if-no-files-found: error
          retention-days: 7
      - name: Launch actual game executable and capture iOS runtime diagnostics
        timeout-minutes: 8
        env:
          HORIZON_NATIVE_SIMULATOR_APP: ${{ runner.temp }}/horizon-ios-game-artifacts/HorizonGame.app
        run: bash packaging/ios/tests/native_game_simulator_smoke.sh
      - name: Upload game Simulator screenshot and native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-game-simulator-diagnostics
          path: |
            ${{ runner.temp }}/horizon-ios-game-simulator-screen.png
            ${{ runner.temp }}/horizon-ios-game-simulator-console.log
            ${{ runner.temp }}/horizon-ios-game-simulator-game.log
          if-no-files-found: ignore
          retention-days: 7

  # Re-run only the expensive-to-inspect native Simulator startup, reusing a
  # previous binary. This avoids rebuilding the whole Rust game (20+ minutes)
  # when testing screenshot timing and diagnosing the first displayed frame.
  game-simulator-smoke:
    if: ${{ inputs.build_target == 'game-smoke' }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download native game bundle from the requested successful run
        uses: actions/download-artifact@v4
        with:
          name: horizon-ios-game-simulator-app
          run-id: ${{ inputs.source_game_simulator_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/horizon-ios-game-artifacts
      - name: Unpack existing native game Simulator executable
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/horizon-ios-game-artifacts/HorizonGame-simulator-unsigned.zip"
          test -s "$archive"
          ditto -x -k "$archive" "$RUNNER_TEMP/horizon-ios-game-artifacts"
          test -x "$RUNNER_TEMP/horizon-ios-game-artifacts/HorizonGame.app/HorizonGame"
      - name: Launch existing game executable and capture post-render diagnostics
        timeout-minutes: 8
        env:
          HORIZON_NATIVE_SIMULATOR_APP: ${{ runner.temp }}/horizon-ios-game-artifacts/HorizonGame.app
        run: bash packaging/ios/tests/native_game_simulator_smoke.sh
      - name: Upload game Simulator screenshot and native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-game-simulator-diagnostics
          path: |
            ${{ runner.temp }}/horizon-ios-game-simulator-screen.png
            ${{ runner.temp }}/horizon-ios-game-simulator-console.log
            ${{ runner.temp }}/horizon-ios-game-simulator-game.log
          if-no-files-found: ignore
          retention-days: 7
