name: Horizon iOS Build

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'crates/horizon-ios/**'
      - 'crates/horizon-core/**'
      - 'crates/horizon-hdr/**'
      - 'crates/horizon-client-input/**'
      - 'crates/horizon-client-render/**'
      - 'crates/horizon-client/**'
      - 'packaging/ios/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'third_party/winit/**'
      - '.github/workflows/ios-simulator.yml'
  push:
    branches: [ios]
    paths:
      - 'crates/horizon-ios/**'
      - 'crates/horizon-core/**'
      - 'crates/horizon-hdr/**'
      - 'crates/horizon-client-input/**'
      - 'crates/horizon-client-render/**'
      - 'crates/horizon-client/**'
      - 'packaging/ios/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'third_party/winit/**'
      - '.github/workflows/ios-simulator.yml'
  workflow_dispatch:
    inputs:
      build_device:
        description: 'Build the unsigned device IPA (enabled by default)'
        type: boolean
        required: false
        default: true

jobs:
  ffi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Run Rust bridge and shared input tests
        run: |
          cargo test --locked -p horizon-ios
          cargo test --locked -p horizon-client-input --lib
          cargo test --locked --no-default-features -p horizon-client --lib resource_install::tests::
          cargo test --locked --no-default-features -p horizon-client --lib game_startup::tests::
      - name: Test iOS CI validators (graphics + unsigned IPA)
        run: python3 -m unittest discover -s packaging/ios/tests -p 'test_*.py'
      - name: Verify iOS dependency isolation
        run: packaging/ios/tests/check_portability.sh
      - name: Verify the Rust C ABI from C
        run: packaging/ios/tests/run_ffi_smoke.sh
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-ios-sim
      - name: Build and link the iOS Simulator app (arm64)
        run: |
          xcodebuild \
            -project packaging/ios/HorizonIOS.xcodeproj \
            -derivedDataPath "$RUNNER_TEMP/HorizonDerivedData" \
            -scheme HorizonIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build
      - name: Package the Simulator app
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/package_app.sh simulator
      - name: Upload Simulator app (unsigned .app.zip)
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-simulator-app
          path: ${{ runner.temp }}/horizon-ios-artifacts/HorizonIOS-simulator-unsigned.zip
          if-no-files-found: error
          retention-days: 14
      - name: Launch in iPhone Simulator and capture preview
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/tests/simulator_smoke.sh
      - name: Upload iOS native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-simulator-logs
          path: ${{ runner.temp }}/horizon-ios-simulator-native.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-simulator-preview
          path: ${{ runner.temp }}/horizon-ios-smoke.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Probe real Horizon boot renderer in iOS Simulator (experimental)
        # Exposing the complete Horizon GPU path can reveal unsupported iOS
        # pipelines. Record a failure without blocking the stable IPA build.
        continue-on-error: true
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/tests/simulator_renderer_smoke.sh
      - name: Upload Horizon boot-renderer diagnostic status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-boot-renderer-status
          path: ${{ runner.temp }}/horizon-ios-boot-renderer-*.json
          if-no-files-found: ignore
          retention-days: 14

  device-build:
    # On ios pushes always produce the IPA; manual runs can skip it if desired.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_device == true)
    # Cross-compile ARM64 iPhoneOS on an Intel Mac when Apple Silicon runners
    # are capacity constrained. The app binary is still arm64 for real iPhones.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target for real iOS hardware
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-ios
      - name: Build unsigned iPhone/iPad app
        run: |
          xcodebuild \
            -project packaging/ios/HorizonIOS.xcodeproj \
            -derivedDataPath "$RUNNER_TEMP/HorizonDerivedData" \
            -scheme HorizonIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build
      - name: Package unsigned device IPA and verify its ZIP payload
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/package_unsigned_ipa.sh
      - name: Upload horizon-ios-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-unsigned-ipa
          path: ${{ runner.temp }}/horizon-ios-artifacts/horizon-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
