name: Horizon iOS Manual Build

permissions:
  contents: read

# macOS builders are expensive in runner minutes. Never build for every push.
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Which artifact to build?'
        type: choice
        options:
          - device
          - simulator
          - both
        required: true
        default: device
      renderer_probe:
        description: 'Run the experimental real Horizon GPU preview (Simulator only)'
        type: boolean
        required: false
        default: false

# Allow only one costly manual build per branch at once; no implicit cancellation
# of a build that has already consumed macOS minutes.
concurrency:
  group: horizon-ios-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator-build:
    if: ${{ inputs.build_target == 'simulator' || inputs.build_target == 'both' }}
    # Intel macOS runners are usually available even when macOS arm64 workers
    # are capacity-constrained. Test the actual x86_64 Simulator runtime here;
    # the independent device job still cross-compiles real iPhoneOS arm64.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: x86_64-apple-ios
      - name: Cache Rust dependencies and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: horizon-ios-macos
          cache-on-failure: true
      - name: Build and link the iOS Simulator app (x86_64)
        run: |
          xcodebuild \
            -project packaging/ios/HorizonIOS.xcodeproj \
            -derivedDataPath "$RUNNER_TEMP/HorizonDerivedData" \
            -scheme HorizonIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=x86_64 \
            build
      - name: Package the Simulator app
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/package_app.sh simulator
      - name: Upload Simulator app (unsigned .app.zip)
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-simulator-app
          path: ${{ runner.temp }}/horizon-ios-artifacts/HorizonIOS-simulator-unsigned.zip
          if-no-files-found: error
          retention-days: 7
      - name: Launch in iPhone Simulator and capture preview
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/tests/simulator_smoke.sh
      - name: Upload iOS native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-simulator-logs
          path: ${{ runner.temp }}/horizon-ios-simulator-native.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-simulator-preview
          path: ${{ runner.temp }}/horizon-ios-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Probe real Horizon boot renderer in iOS Simulator (experimental)
        if: ${{ inputs.renderer_probe }}
        # When explicitly requested, a failed Horizon frame must fail the run;
        # the ordinary Metal probe and device IPA are unaffected.
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/tests/simulator_renderer_smoke.sh
      - name: Upload Horizon boot-renderer diagnostic status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-boot-renderer-status
          path: |
            ${{ runner.temp }}/horizon-ios-boot-renderer-*.json
            ${{ runner.temp }}/horizon-ios-boot-renderer-*.log
            ${{ runner.temp }}/horizon-ios-boot-renderer-*.png
          if-no-files-found: ignore
          retention-days: 7

  device-build:
    if: ${{ inputs.build_target == 'device' || inputs.build_target == 'both' }}
    # Cross-compile ARM64 iPhoneOS on an Intel Mac when Apple Silicon runners
    # are capacity constrained. The app binary is still arm64 for real iPhones.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target for real iOS hardware
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-apple-ios
      - name: Cache Rust dependencies and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: horizon-ios-macos
          cache-on-failure: true
      - name: Build unsigned iPhone/iPad app
        run: |
          xcodebuild \
            -project packaging/ios/HorizonIOS.xcodeproj \
            -derivedDataPath "$RUNNER_TEMP/HorizonDerivedData" \
            -scheme HorizonIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build
      - name: Package unsigned device IPA and verify its ZIP payload
        env:
          DERIVED_DATA: ${{ runner.temp }}/HorizonDerivedData
        run: packaging/ios/package_unsigned_ipa.sh
      - name: Upload horizon-ios-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-unsigned-ipa
          path: ${{ runner.temp }}/horizon-ios-artifacts/horizon-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
