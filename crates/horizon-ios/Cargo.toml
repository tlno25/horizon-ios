[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon iOS native C ABI and UIKit/Winit bootstrap"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
horizon-core = { path = "../horizon-core" }

[target.'cfg(target_os = "ios")'.dependencies]
horizon-client-input = { path = "../horizon-client-input" }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
pollster = "0.4"

[lints]
workspace = true
